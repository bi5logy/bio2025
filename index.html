<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>생명과학 I 성찰 기록장</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel (JSX 변환) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50">

  <div id="root"></div>

  <script type="text/babel">

    const {
      useState,
      useEffect,
      useRef
    } = React;

    const {
      ClipboardList,
      GraduationCap,
      Send,
      CheckCircle,
      BookOpen,
      MessageCircle,
      Heart
    } = lucideReact;

    // ⭐ 교사용 설정 (Apps Script URL)
    const GOOGLE_SHEET_URL = "여기에_선생님_GAS_URL_붙여넣기";

    const ACHIEVEMENT_STANDARDS = {
      "1. 생명과학의 이해": [
        "생물의 특성과 생물/비생물의 차이",
        "생명과학의 통합적 특성과 타 학문 연계",
        "귀납적 탐구와 연역적 탐구 방법 비교"
      ],
      "2. 사람의 물질대사": [
        "세포 호흡과 ATP의 생성 및 이용",
        "물질대사와 소화·호흡·순환·배설의 관계",
        "대사성 질환의 원인과 예방 및 생활 습관"
      ]
    };

    function App() {
      const [step, setStep] = useState("info");
      const [studentInfo, setStudentInfo] = useState({
        name: "",
        studentId: "",
        classGroup: "A"
      });
      const [selectedUnits, setSelectedUnits] = useState([]);
      const [selectedSubContents, setSelectedSubContents] = useState({});
      const [chatHistory, setChatHistory] = useState([]);
      const [inputText, setInputText] = useState("");
      const scrollRef = useRef(null);

      useEffect(() => {
        if (scrollRef.current) {
          scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
        }
      }, [chatHistory]);

      const addBot = text =>
        setChatHistory(prev => [...prev, { role: "bot", text }]);

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="w-full max-w-xl bg-white rounded-3xl shadow-xl h-[90vh] flex flex-col">

            <div className="bg-emerald-600 p-4 text-white font-bold flex items-center gap-2">
              <ClipboardList />
              생명과학 I 성찰 기록장
            </div>

            {step === "info" && (
              <div className="flex-1 flex flex-col items-center justify-center gap-4 p-6 text-center">
                <GraduationCap size={48} className="text-emerald-600" />
                <input
                  className="border p-3 rounded-xl w-full"
                  placeholder="학번"
                  onChange={e =>
                    setStudentInfo({ ...studentInfo, studentId: e.target.value })
                  }
                />
                <input
                  className="border p-3 rounded-xl w-full"
                  placeholder="이름"
                  onChange={e =>
                    setStudentInfo({ ...studentInfo, name: e.target.value })
                  }
                />
                <button
                  className="bg-emerald-600 text-white px-6 py-3 rounded-xl"
                  onClick={() => setStep("chat")}
                >
                  시작하기
                </button>
              </div>
            )}

            {step === "chat" && (
              <>
                <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 space-y-3">
                  {chatHistory.map((m, i) => (
                    <div key={i} className={m.role === "bot" ? "text-left" : "text-right"}>
                      <div
                        className={
                          m.role === "bot"
                            ? "inline-block bg-slate-100 p-3 rounded-xl"
                            : "inline-block bg-emerald-600 text-white p-3 rounded-xl"
                        }
                      >
                        {m.text}
                      </div>
                    </div>
                  ))}
                </div>

                <div className="p-3 border-t flex gap-2">
                  <textarea
                    className="flex-1 border rounded-xl p-2"
                    value={inputText}
                    onChange={e => setInputText(e.target.value)}
                  />
                  <button
                    className="bg-emerald-600 text-white p-3 rounded-xl"
                    onClick={() => {
                      addBot("답변이 잘 저장되었습니다 😊");
                      setInputText("");
                    }}
                  >
                    <Send />
                  </button>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
