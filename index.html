<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생명과학 I 심층 성찰 기록장</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- [중요] 선생님 설정값: 구글 앱스 스크립트 배포 후 받은 URL을 여기에 넣으세요 ---
        const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwG_MWo7oMMYsTD32ds8oYtvMcjAYsL1Gv00X5twwaaxmIcYiPEU-NaGLXKCg6gtiul/exec"; 

        const UNIT_DATA = {
            "1": { name: "1. 생명 과학의 이해", standards: ["A. 생명 과학의 통합적 특성과 타 학문 연계성", "B. 연역적 탐구 방법 등 다양한 탐구 방법 비교", "C. 생물의 특성과 생물/비생물 차이"] },
            "2": { name: "2. 사람의 물질대사", standards: ["A. 물질대사와 ATP, 소화/호흡/순환 관련성", "B. 세포 호흡 결과 노폐물 배설 과정", "C. 대사성 질환 조사 및 생활 습관 토의"] },
            "3": { name: "3. 항상성과 건강", standards: ["A. 흥분 전도와 전달 및 약물의 영향", "B. 근섬유 구조와 근수축 활주설", "C. 신경계 구조/기능 및 관련 질환", "D. 호르몬 특성과 과잉/결핍 질환", "E. 항상성 유지 조절 과정", "F. 방어 작용과 백신의 원리"] },
            "4": { name: "4. 유전", standards: ["A. 염색체, DNA, 유전자와 세포 분열", "B. 생식 세포 형성과 유전적 다양성", "C. 가계도 분석(상/성염색체 구분)", "D. 염색체/유전자 이상 유전병"] },
            "5": { name: "5. 생태계와 상호 작용", standards: ["A. 생태계 구성 요소와 상호 작용", "B. 군집 조사(우점종)와 천이 과정", "C. 에너지 흐름과 물질 순환", "D. 생물다양성 의미와 보전 방안"] }
        };

        const App = () => {
            const [step, setStep] = useState('info');
            const [studentInfo, setStudentInfo] = useState({ name: '', studentId: '', studentClass: '' });
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [isSaving, setIsSaving] = useState(false);
            
            const [selectedUnits, setSelectedUnits] = useState([]); 
            const [currentPhase, setCurrentPhase] = useState('SELECT_UNIT_1'); 

            const scrollRef = useRef(null);
            useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages]);

            const addBotMessage = (text) => setMessages(prev => [...prev, { role: 'bot', text }]);

            const startSurvey = () => {
                if (!studentInfo.name || !studentInfo.studentId || !studentInfo.studentClass) return;
                setStep('chat');
                addBotMessage(`반가워, ${studentInfo.studentClass}반 ${studentInfo.name} 학생!\n\n올해 생명과학 수업 내용 중 가장 기억에 남는 **첫 번째 대단원**을 번호(1~5)로 골라줘.\n\n1. 생명 과학의 이해\n2. 사람의 물질대사\n3. 항상성과 건강\n4. 유전\n5. 생태계와 상호 작용`);
            };

            const handleSendMessage = async () => {
                if (!inputText.trim() || isSaving) return;
                const input = inputText.trim();
                const newHistory = [...messages, { role: 'user', text: input }];
                setMessages(newHistory);
                setInputText('');

                if (currentPhase === 'SELECT_UNIT_1') {
                    const num = input.match(/[1-5]/)?.[0];
                    if (num) {
                        setSelectedUnits([num]);
                        setCurrentPhase('SELECT_DETAIL_1');
                        addBotMessage(`**[${UNIT_DATA[num].name}]** 단원에서 수업을 들으며 더 깊이 이해하고 싶었던 세부 주제를 하나 골라봐.\n\n${UNIT_DATA[num].standards.join('\n')}\n\n(A, B, C 등 알파벳 입력)`);
                    } else addBotMessage("1~5 사이 숫자를 입력해 줘.");
                } 
                else if (currentPhase === 'SELECT_DETAIL_1') {
                    if (/[A-F]/.test(input.toUpperCase())) {
                        setCurrentPhase('QUESTION_1_1');
                        addBotMessage(`Q1. 이 주제에 대해 수업을 듣거나 관련 자료를 보던 중, **'왜 그럴까?'** 하고 추가로 호기심이 생겼던 부분은 무엇이었나요? (학습 동기)`);
                    } else addBotMessage("알파벳 중 하나를 선택해 줘.");
                }
                else if (currentPhase === 'QUESTION_1_1') {
                    setCurrentPhase('QUESTION_1_2');
                    addBotMessage(`Q2. 그 호기심을 해결하기 위해 스스로 찾아본 자료나 노력이 있다면 적어주세요. (예: 교과서 심화 읽기, 관련 기사/도서 검색, 교육 영상 시청 등)`);
                }
                else if (currentPhase === 'QUESTION_1_2') {
                    setCurrentPhase('QUESTION_1_3');
                    addBotMessage(`Q3. 스스로 찾아보고 학습한 결과, 새롭게 알게 된 사실이나 이전의 생각이 바뀌게 된 지점이 있다면 무엇인가요?`);
                }
                else if (currentPhase === 'QUESTION_1_3') {
                    setCurrentPhase('SELECT_UNIT_2');
                    const remainingUnits = Object.keys(UNIT_DATA).filter(k => k !== selectedUnits[0]);
                    const unitList = remainingUnits.map(k => `${k}. ${UNIT_DATA[k].name}`).join('\n');
                    addBotMessage(`첫 번째 기록 완료! 이제 **두 번째로 흥미로웠던 단원**을 골라줘. (이전 선택 제외)\n\n${unitList}`);
                }
                else if (currentPhase === 'SELECT_UNIT_2') {
                    const num = input.match(/[1-5]/)?.[0];
                    if (num && num !== selectedUnits[0]) {
                        setSelectedUnits([...selectedUnits, num]);
                        setCurrentPhase('SELECT_DETAIL_2');
                        addBotMessage(`**[${UNIT_DATA[num].name}]** 단원이야. 어떤 세부 주제를 선택할까?\n\n${UNIT_DATA[num].standards.join('\n')}`);
                    } else addBotMessage(`이전 단원(${selectedUnits[0]}번)을 제외한 번호를 입력해 줘.`);
                }
                else if (currentPhase === 'SELECT_DETAIL_2') {
                    if (/[A-F]/.test(input.toUpperCase())) {
                        setCurrentPhase('QUESTION_2_1');
                        addBotMessage(`Q4. 이 주제를 공부하면서 느낀 생명과학의 매력은 무엇인가요? 본인이 관심 있는 분야나 진로와 연결지어 답변해 주세요.`);
                    } else addBotMessage("알파벳을 정확히 입력해 줘.");
                }
                else if (currentPhase === 'QUESTION_2_1') {
                    setCurrentPhase('FINAL_COMMON');
                    addBotMessage(`마지막 질문! 생명과학 수업을 듣기 전과 후, 세상을 바라보는 관점에서 가장 크게 변화한 점은 무엇인가요?`);
                }
                else if (currentPhase === 'FINAL_COMMON') {
                    setIsSaving(true);
                    addBotMessage("정성스럽게 작성해줘서 고마워! 네 기록이 풍성한 세특이 될 수 있도록 선생님께 잘 전달할게.");
                    await saveToSheet(newHistory);
                    setStep('completed');
                    setIsSaving(false);
                }
            };

            const saveToSheet = async (history) => {
                if (!GOOGLE_SHEET_URL) {
                    console.warn("GOOGLE_SHEET_URL이 설정되지 않았습니다.");
                    return;
                }
                const summary = history.map(m => `${m.role === 'user' ? '학생' : '질문'}: ${m.text}`).join('\n\n');
                
                const payload = {
                    name: studentInfo.name,
                    studentId: studentInfo.studentId,
                    studentClass: studentInfo.studentClass,
                    content: summary,
                    date: new Date().toLocaleString('ko-KR')
                };

                try {
                    await fetch(GOOGLE_SHEET_URL, {
                        method: 'POST',
                        mode: 'no-cors', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (e) {
                    console.error("전송 중 오류 발생:", e);
                }
            };

            return (
                <div className="flex justify-center items-center min-h-screen p-4 bg-slate-100">
                    <div className="w-full max-w-lg bg-white rounded-3xl shadow-2xl flex flex-col h-[85vh] overflow-hidden border border-slate-200">
                        <div className="bg-indigo-600 p-5 text-white shadow-md">
                            <h1 className="font-extrabold text-lg flex items-center gap-2">🧬 생명과학 I 수업 성찰 기록장</h1>
                            <p className="text-[10px] opacity-70 font-medium">수업 기반 심층 탐구 기록 시스템</p>
                        </div>

                        <div className="flex-1 overflow-hidden flex flex-col bg-slate-50">
                            {step === 'info' ? (
                                <div className="p-8 flex flex-col items-center justify-center h-full space-y-4 animate-fade-in text-center">
                                    <div className="text-4xl mb-2">🎓</div>
                                    <h2 className="text-xl font-bold text-slate-800">정보 입력</h2>
                                    <div className="w-full max-w-sm space-y-3">
                                        <div className="flex gap-2">
                                            <input 
                                                type="text" 
                                                placeholder="반" 
                                                className="w-1/3 p-4 rounded-2xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500 text-center font-bold" 
                                                value={studentInfo.studentClass} 
                                                onChange={e => setStudentInfo({...studentInfo, studentClass: e.target.value})} 
                                            />
                                            <input 
                                                type="text" 
                                                placeholder="학번" 
                                                className="w-2/3 p-4 rounded-2xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500 text-center font-bold" 
                                                value={studentInfo.studentId} 
                                                onChange={e => setStudentInfo({...studentInfo, studentId: e.target.value})} 
                                            />
                                        </div>
                                        <input 
                                            type="text" 
                                            placeholder="이름" 
                                            className="w-full p-4 rounded-2xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500 text-center font-bold" 
                                            value={studentInfo.name} 
                                            onChange={e => setStudentInfo({...studentInfo, name: e.target.value})} 
                                        />
                                        <button 
                                            onClick={startSurvey} 
                                            disabled={!studentInfo.name || !studentInfo.studentId || !studentInfo.studentClass} 
                                            className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg hover:bg-indigo-700 disabled:bg-slate-300 transition-all mt-2"
                                        >
                                            기록 시작
                                        </button>
                                    </div>
                                </div>
                            ) : step === 'chat' ? (
                                <>
                                    <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
                                        {messages.map((msg, i) => (
                                            <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                <div className={`max-w-[85%] px-4 py-3 rounded-2xl text-sm shadow-sm whitespace-pre-wrap ${msg.role === 'user' ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-white border border-slate-200 text-slate-700 rounded-tl-none'}`}>
                                                    {msg.text}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="p-4 bg-white border-t flex gap-2">
                                        <textarea 
                                            rows="2" 
                                            className="flex-1 bg-slate-100 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500 resize-none border-none" 
                                            value={inputText} 
                                            onChange={e => setInputText(e.target.value)} 
                                            placeholder="이곳에 답변을 작성하세요..." 
                                            onKeyDown={e => {if(e.key==='Enter' && !e.shiftKey){e.preventDefault(); handleSendMessage();}}} 
                                        />
                                        <button 
                                            onClick={handleSendMessage} 
                                            disabled={!inputText.trim() || isSaving} 
                                            className="px-4 bg-indigo-600 text-white rounded-xl font-bold disabled:bg-slate-300 transition-all shadow-md"
                                        >
                                            전송
                                        </button>
                                    </div>
                                </>
                            ) : (
                                <div className="p-8 flex flex-col items-center justify-center h-full space-y-4 animate-fade-in text-center">
                                    <div className="text-5xl">✅</div>
                                    <h2 className="text-2xl font-bold text-slate-800">제출 완료</h2>
                                    <p className="text-slate-500 text-sm italic">"{studentInfo.name} 학생의 기록이 구글 시트로 안전하게 전송되었습니다."</p>
                                    <button onClick={() => window.location.reload()} className="text-indigo-600 font-bold hover:underline transition-all mt-4">새로 기록하기</button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
