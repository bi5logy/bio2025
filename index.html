<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생명과학 I 성찰 기록장 (설문형)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #root { min-height: 100vh; }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 선생님 설정값 ---
        const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbx49Gxz0TmTDhSPWP_qpMLvRLUspXAUIV_GpJUBZ6o11kh4sGiZNqA2h_2JLEoWtj4i/exec"; 
        
        // 고정 질문 리스트 (세특 작성을 위한 핵심 질문들)
        const QUESTIONS = [
            "올해 생명과학 I 수업에서 가장 흥미로웠던 단원이나 주제는 무엇인가요? (예: 유전, 항상성, 생태계 등)",
            "그 주제를 배우면서 새롭게 알게 된 사실이나 더 깊이 탐구해보고 싶었던 내용은 무엇이었나요?",
            "수업 시간 중 수행평가나 탐구 활동에서 본인이 주도적으로 기여한 부분은 무엇인가요? (실험 설계, 자료 조사, 발표 등)",
            "어려운 개념을 이해하기 위해 본인만의 노력(관련 서적 읽기, 문제 풀이, 친구와 토론 등)을 기울인 사례가 있다면 구체적으로 적어주세요.",
            "생명과학 지식을 실생활이나 자신의 진로(의학, 생명공학, 환경 등)와 연결 지어 고민해본 적이 있나요?",
            "마지막으로 한 학기 동안 수업에 참여하며 느낀 소감이나 본인의 성장에 대해 자유롭게 들려주세요."
        ];
        // -------------------

        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                "clipboard-list": <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2m4-2v4m-4 0h8m-5 8h4m-4 4h4" />,
                "graduation-cap": <path d="M22 10v6M2 10l10-5 10 5-10 5zM6 12v5c3 3 9 3 12 0v-5" />,
                "send": <path d="m22 2-7 20-4-9-9-4Z M22 2l-11 11" />,
                "check-circle": <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14 M22 4L12 14.01l-3-3" />,
            };
            return (
                <svg 
                    width={size} 
                    height={size} 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    className={className}
                >
                    {icons[name] || null}
                </svg>
            );
        };

        const App = () => {
            const [step, setStep] = useState('info'); 
            const [studentInfo, setStudentInfo] = useState({ name: '', studentId: '' });
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
            const [isSaving, setIsSaving] = useState(false);
            const scrollRef = useRef(null);

            useEffect(() => {
                if (scrollRef.current) {
                    scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
                }
            }, [messages]);

            const startChat = () => {
                if (!studentInfo.name.trim() || !studentInfo.studentId.trim()) return;
                setStep('chat');
                setMessages([{ role: 'bot', text: `반가워, ${studentInfo.name} 학생! 생기부 작성을 위한 몇 가지 질문을 할게. 솔직하고 구체적으로 답해줘.\n\nQ1. ${QUESTIONS[0]}` }]);
            };

            const handleSendMessage = async () => {
                if (!inputText.trim() || isSaving) return;

                const userResponse = inputText;
                const newMessages = [...messages, { role: 'user', text: userResponse }];
                setMessages(newMessages);
                setInputText('');

                const nextIdx = currentQuestionIdx + 1;
                
                if (nextIdx < QUESTIONS.length) {
                    // 다음 질문 제시
                    setMessages(prev => [...prev, { role: 'bot', text: `Q${nextIdx + 1}. ${QUESTIONS[nextIdx]}` }]);
                    setCurrentQuestionIdx(nextIdx);
                } else {
                    // 모든 질문 완료
                    setIsSaving(true);
                    setMessages(prev => [...prev, { role: 'bot', text: "모든 답변을 확인했어! 이제 선생님의 구글 시트로 전송할게. 잠시만 기다려줘..." }]);
                    await saveToSheet(newMessages);
                    setTimeout(() => setStep('completed'), 2000);
                }
            };

            const saveToSheet = async (finalMessages) => {
                if (!GOOGLE_SHEET_URL) return;

                // 질문과 답변을 매칭하여 저장
                const conversationText = finalMessages
                    .filter(m => m.role === 'user')
                    .map((m, i) => `질문${i+1}: ${QUESTIONS[i]}\n답변: ${m.text}`)
                    .join('\n\n');

                const formData = new URLSearchParams();
                formData.append('name', studentInfo.name);
                formData.append('studentId', studentInfo.studentId);
                formData.append('content', conversationText);
                formData.append('date', new Date().toLocaleString('ko-KR'));

                try {
                    await fetch(GOOGLE_SHEET_URL, {
                        method: 'POST',
                        mode: 'no-cors', 
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formData.toString()
                    });
                } catch (e) { 
                    console.error("Sheet Error", e); 
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="w-full max-w-xl bg-white rounded-[2rem] shadow-2xl overflow-hidden flex flex-col h-[85vh] border border-slate-200">
                        {/* Header */}
                        <div className="bg-gradient-to-r from-emerald-600 to-teal-600 p-6 text-white flex items-center justify-between shadow-lg z-10">
                            <div className="flex items-center gap-3">
                                <div className="bg-white/20 p-2 rounded-xl"><Icon name="clipboard-list" /></div>
                                <div>
                                    <h1 className="font-bold text-lg leading-tight">생명과학 I 성찰 기록장</h1>
                                    <p className="text-[10px] opacity-80 font-medium">선생님 확인용 설문 가이드</p>
                                </div>
                            </div>
                            <div className="text-[10px] bg-black/20 px-3 py-1 rounded-full font-bold">
                                질문 {Math.min(currentQuestionIdx + 1, QUESTIONS.length)} / {QUESTIONS.length}
                            </div>
                        </div>

                        {/* Content Area */}
                        <div className="flex-1 overflow-hidden flex flex-col relative bg-slate-50">
                            {step === 'info' && (
                                <div className="p-8 flex flex-col items-center justify-center h-full text-center space-y-6 animate-fade-in">
                                    <div className="w-20 h-20 bg-emerald-50 rounded-3xl flex items-center justify-center text-emerald-600 rotate-6 shadow-sm"><Icon name="graduation-cap" size={40} /></div>
                                    <div>
                                        <h2 className="text-xl font-extrabold text-slate-800 leading-tight">학생의 성장을 기록합니다.</h2>
                                        <p className="text-sm text-slate-500 mt-2">이름과 학번을 입력하면 설문이 시작됩니다.</p>
                                    </div>
                                    <div className="w-full max-w-sm space-y-3">
                                        <div className="flex gap-2">
                                            <input type="text" placeholder="이름" className="w-1/3 p-4 bg-white border-2 border-slate-100 rounded-xl text-center font-bold outline-none focus:border-emerald-500 shadow-sm" value={studentInfo.name} onChange={e => setStudentInfo({...studentInfo, name: e.target.value})} />
                                            <input type="text" placeholder="학번" className="w-2/3 p-4 bg-white border-2 border-slate-100 rounded-xl text-center font-bold outline-none focus:border-emerald-500 shadow-sm" value={studentInfo.studentId} onChange={e => setStudentInfo({...studentInfo, studentId: e.target.value})} />
                                        </div>
                                        <button onClick={startChat} className="w-full py-4 bg-emerald-600 text-white font-bold rounded-xl shadow-lg active:scale-95 transition-all hover:bg-emerald-700">설문 시작하기</button>
                                    </div>
                                </div>
                            )}

                            {step === 'chat' && (
                                <>
                                    <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 space-y-6">
                                        {messages.map((msg, idx) => (
                                            <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in`}>
                                                <div className={`max-w-[85%] px-5 py-3 rounded-2xl text-[14px] leading-relaxed shadow-sm ${msg.role === 'user' ? 'bg-emerald-600 text-white rounded-tr-none' : 'bg-white text-slate-700 rounded-tl-none border border-slate-200'}`}>
                                                    {msg.text.split('\n').map((line, i) => <p key={i} className="mb-1">{line}</p>)}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="p-4 bg-white border-t flex gap-2 items-end shadow-[0_-4px_10px_rgba(0,0,0,0.03)]">
                                        <textarea rows="3" className="flex-1 bg-slate-50 rounded-2xl p-4 text-sm outline-none focus:ring-2 focus:ring-emerald-500 resize-none font-medium border border-slate-200" value={inputText} onChange={e => setInputText(e.target.value)} placeholder="질문에 대한 답변을 입력하세요..." onKeyDown={e => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSendMessage(); } }} />
                                        <button onClick={handleSendMessage} disabled={!inputText.trim() || isSaving} className="p-4 bg-emerald-600 text-white rounded-2xl shadow-md disabled:bg-slate-300 active:scale-90 transition-all flex items-center justify-center h-[52px] w-[52px]"><Icon name="send" size={20} /></button>
                                    </div>
                                </>
                            )}

                            {step === 'completed' && (
                                <div className="p-8 flex flex-col items-center justify-center h-full text-center space-y-4 animate-fade-in">
                                    <div className="w-20 h-20 bg-green-50 text-green-500 rounded-full flex items-center justify-center shadow-inner"><Icon name="check-circle" size={50} /></div>
                                    <h2 className="text-2xl font-bold text-slate-800">제출 완료!</h2>
                                    <p className="text-slate-500 text-sm leading-relaxed">수고했어요, {studentInfo.name} 학생.<br/>작성한 모든 답변이 선생님에게 전송되었습니다.<br/>성실한 답변 고마워요!</p>
                                    <button onClick={() => window.location.reload()} className="px-6 py-2 text-emerald-600 font-semibold text-sm hover:underline mt-4">새로 작성하기</button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
