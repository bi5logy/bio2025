<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생명과학 I 성찰 기록장</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #root { min-height: 100vh; }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 선생님 설정값 ---
        const apiKey = "AIzaSyD4TfJUeDeF_FBtRVAwcyMpKpuAgY9pSws"; 
        const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbx49Gxz0TmTDhSPWP_qpMLvRLUspXAUIV_GpJUBZ6o11kh4sGiZNqA2h_2JLEoWtj4i/exec"; 
        // -------------------

        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                "clipboard-list": <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2m4-2v4m-4 0h8m-5 8h4m-4 4h4" />,
                "graduation-cap": <path d="M22 10v6M2 10l10-5 10 5-10 5zM6 12v5c3 3 9 3 12 0v-5" />,
                "send": <path d="m22 2-7 20-4-9-9-4Z M22 2l-11 11" />,
                "check-circle": <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14 M22 4L12 14.01l-3-3" />,
                "sparkles": <path d="m12 3 1.91 5.81L21 12l-7.09 3.19L12 21l-1.91-5.81L3 12l7.09-3.19z" />
            };
            return (
                <svg 
                    width={size} 
                    height={size} 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    className={className}
                >
                    {icons[name] || null}
                </svg>
            );
        };

        const App = () => {
            const [step, setStep] = useState('info'); 
            const [studentInfo, setStudentInfo] = useState({ name: '', studentId: '' });
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [turnCount, setTurnCount] = useState(0);
            const [topicCount, setTopicCount] = useState(1); 
            const scrollRef = useRef(null);

            const MAX_TURNS = 12; 

            useEffect(() => {
                if (scrollRef.current) {
                    scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
                }
            }, [messages, isTyping]);

            const generateAIResponse = async (history) => {
                if (!apiKey) return "API 키가 설정되지 않았습니다.";

                const systemPrompt = `당신은 고등학교 생명과학1 선생님입니다. 학생의 답변에서 세특에 기록할만한 '학업 역량'과 '탐구 의지'를 최대한 끌어내어 2가지 에피소드를 완성하세요. 1~5턴은 첫 번째 주제, 6~10턴은 두 번째 주제, 11턴은 소감 질문, 12턴은 종료입니다.`;

                // history 포맷 최적화
                const contents = history.map(m => ({
                    role: m.role === 'user' ? 'user' : 'model',
                    parts: [{ text: m.text }]
                }));

                // 지수 백오프를 적용한 재시도 로직 (네트워크 불안정 대응)
                const fetchWithRetry = async (retries = 3, delay = 1000) => {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: contents,
                                systemInstruction: { parts: [{ text: systemPrompt }] }
                            })
                        });
                        
                        if (!response.ok) {
                            const error = await response.json();
                            throw new Error(error.error?.message || "API Error");
                        }
                        return await response.json();
                    } catch (err) {
                        if (retries > 0) {
                            await new Promise(res => setTimeout(res, delay));
                            return fetchWithRetry(retries - 1, delay * 2);
                        }
                        throw err;
                    }
                };

                try {
                    const result = await fetchWithRetry();
                    return result.candidates?.[0]?.content?.parts?.[0]?.text || "답변을 생성하지 못했습니다.";
                } catch (e) { 
                    console.error("Fetch Error:", e);
                    return "잠시 연결이 지연되고 있네요. 다시 한번만 말씀해 주시겠어요? (오류: " + e.message + ")"; 
                }
            };

            const startChat = () => {
                if (!studentInfo.name.trim() || !studentInfo.studentId.trim()) return;
                setStep('chat');
                const firstMsg = `안녕, ${studentInfo.name} 학생! 반가워.\n선생님이 너의 노력과 성장을 생기부에 아주 생생하게 담아주고 싶어서 이 자리를 마련했어.\n\n우선 올해 배운 내용 중 **가장 지적 호기심을 자극했던 단원**은 무엇이었니?\n\n1. 생명 과학의 이해\n2. 사람의 물질대사\n3. 항상성과 몸의 조절\n4. 유전\n5. 생태계와 상호 작용`;
                setMessages([{ role: 'bot', text: firstMsg }]);
            };

            const handleSendMessage = async () => {
                if (!inputText.trim() || isTyping || turnCount >= MAX_TURNS) return;

                const currentInput = inputText;
                setMessages(prev => [...prev, { role: 'user', text: currentInput }]);
                setInputText('');
                setIsTyping(true);

                const aiResponse = await generateAIResponse([...messages, { role: 'user', text: currentInput }]);
                
                if (turnCount >= 5) setTopicCount(2);

                setMessages(prev => [...prev, { role: 'bot', text: aiResponse }]);
                const nextTurn = turnCount + 1;
                setTurnCount(nextTurn);
                setIsTyping(false);

                if (nextTurn >= MAX_TURNS) {
                    saveToSheet([...messages, { role: 'user', text: currentInput }, { role: 'bot', text: aiResponse }]);
                    setTimeout(() => setStep('completed'), 3000);
                }
            };

            const saveToSheet = async (finalMessages) => {
                if (!GOOGLE_SHEET_URL) return;
                const conversationText = finalMessages
                    .map(m => `${m.role === 'user' ? '학생' : '선생님'}: ${m.text}`)
                    .join('\n\n');
                const formData = new URLSearchParams();
                formData.append('name', studentInfo.name);
                formData.append('studentId', studentInfo.studentId);
                formData.append('content', conversationText);
                formData.append('date', new Date().toLocaleString('ko-KR'));
                try {
                    await fetch(GOOGLE_SHEET_URL, {
                        method: 'POST',
                        mode: 'no-cors', 
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formData.toString()
                    });
                } catch (e) { console.error("Sheet Error", e); }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="w-full max-w-xl bg-white rounded-[2rem] shadow-2xl overflow-hidden flex flex-col h-[85vh] border border-slate-200">
                        {/* Header */}
                        <div className="bg-gradient-to-r from-indigo-600 to-violet-600 p-6 text-white flex items-center justify-between shadow-lg z-10">
                            <div className="flex items-center gap-3">
                                <div className="bg-white/20 p-2 rounded-xl"><Icon name="clipboard-list" /></div>
                                <div>
                                    <h1 className="font-bold text-lg leading-tight">생명과학 I 성찰 기록장</h1>
                                    <p className="text-[10px] opacity-80 font-medium italic">Gemini 2.5 Flash 기반 지능형 상담</p>
                                </div>
                            </div>
                            <div className="flex flex-col items-end gap-1">
                                <span className="text-[10px] bg-black/20 px-3 py-1 rounded-full font-bold">대화 {turnCount}/{MAX_TURNS}</span>
                                <div className="flex gap-1">
                                    {[1, 2].map(i => (
                                        <div key={i} className={`h-1.5 rounded-full transition-all duration-500 ${topicCount >= i ? 'w-6 bg-amber-400' : 'w-2 bg-white/30'}`} />
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Content Area */}
                        <div className="flex-1 overflow-hidden flex flex-col relative bg-slate-50">
                            {step === 'info' && (
                                <div className="p-8 flex flex-col items-center justify-center h-full text-center space-y-6 animate-fade-in">
                                    <div className="w-20 h-20 bg-indigo-50 rounded-3xl flex items-center justify-center text-indigo-600 rotate-6 shadow-sm"><Icon name="graduation-cap" size={40} /></div>
                                    <div>
                                        <h2 className="text-xl font-extrabold text-slate-800 leading-tight">수업시간 반짝였던<br/>당신의 생각을 들려주세요.</h2>
                                        <p className="text-sm text-slate-500 mt-2">입력한 정보는 세특 기록의 기초 자료가 됩니다.</p>
                                    </div>
                                    <div className="w-full space-y-3">
                                        <div className="flex gap-2">
                                            <input type="text" placeholder="이름" className="w-1/3 p-4 bg-white border-2 border-slate-100 rounded-xl text-center font-bold outline-none focus:border-indigo-500 shadow-sm" value={studentInfo.name} onChange={e => setStudentInfo({...studentInfo, name: e.target.value})} />
                                            <input type="text" placeholder="학번" className="w-2/3 p-4 bg-white border-2 border-slate-100 rounded-xl text-center font-bold outline-none focus:border-indigo-500 shadow-sm" value={studentInfo.studentId} onChange={e => setStudentInfo({...studentInfo, studentId: e.target.value})} />
                                        </div>
                                        <button onClick={startChat} className="w-full py-4 bg-indigo-600 text-white font-bold rounded-xl shadow-lg active:scale-95 transition-all hover:bg-indigo-700">대화 시작하기</button>
                                    </div>
                                </div>
                            )}

                            {step === 'chat' && (
                                <>
                                    <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 space-y-6">
                                        {messages.map((msg, idx) => (
                                            <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in`}>
                                                <div className={`max-w-[85%] px-5 py-3 rounded-2xl text-[14px] leading-relaxed shadow-sm ${msg.role === 'user' ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-white text-slate-700 rounded-tl-none border border-slate-200'}`}>
                                                    {msg.text.split('\n').map((line, i) => <p key={i} className="mb-1">{line}</p>)}
                                                </div>
                                            </div>
                                        ))}
                                        {isTyping && (
                                            <div className="flex gap-2 p-2 items-center animate-pulse">
                                                <div className="w-2 h-2 bg-indigo-400 rounded-full"></div>
                                                <div className="w-2 h-2 bg-indigo-400 rounded-full" style={{animationDelay: '0.2s'}}></div>
                                                <div className="w-2 h-2 bg-indigo-400 rounded-full" style={{animationDelay: '0.4s'}}></div>
                                                <span className="text-[11px] text-indigo-400 font-bold italic ml-1 tracking-tight">선생님이 기록을 분석 중입니다...</span>
                                            </div>
                                        )}
                                    </div>
                                    <div className="p-4 bg-white border-t flex gap-2 items-end shadow-[0_-4px_10px_rgba(0,0,0,0.03)]">
                                        <textarea rows="2" className="flex-1 bg-slate-50 rounded-2xl p-4 text-sm outline-none focus:ring-2 focus:ring-indigo-500 resize-none font-medium border border-slate-200" value={inputText} onChange={e => setInputText(e.target.value)} placeholder="선생님의 질문에 답변해 보세요..." onKeyDown={e => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSendMessage(); } }} />
                                        <button onClick={handleSendMessage} disabled={isTyping || !inputText.trim()} className="p-4 bg-indigo-600 text-white rounded-2xl shadow-md disabled:bg-slate-300 active:scale-90 transition-all flex items-center justify-center h-[52px] w-[52px]"><Icon name="send" size={20} /></button>
                                    </div>
                                </>
                            )}

                            {step === 'completed' && (
                                <div className="p-8 flex flex-col items-center justify-center h-full text-center space-y-4 animate-fade-in">
                                    <div className="w-20 h-20 bg-green-50 text-green-500 rounded-full flex items-center justify-center shadow-inner"><Icon name="check-circle" size={50} /></div>
                                    <h2 className="text-2xl font-bold text-slate-800">기록이 완료되었습니다!</h2>
                                    <p className="text-slate-500 text-sm leading-relaxed">수고했어요, {studentInfo.name} 학생.<br/>남겨준 모든 내용은 구글 시트에 안전하게 저장되었으며,<br/>선생님이 생기부 작성 시 적극 참고할게요.</p>
                                    <button onClick={() => window.location.reload()} className="px-6 py-2 text-indigo-600 font-semibold text-sm hover:underline mt-4">처음으로 돌아가기</button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
