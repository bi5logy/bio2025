<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>생명과학 I 성찰 기록장</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>

<body class="bg-slate-50">
  <div id="root"></div>

  <script>
    const e = React.createElement;

    function App() {
      const [step, setStep] = React.useState("info");
      const [name, setName] = React.useState("");
      const [studentId, setStudentId] = React.useState("");
      const [messages, setMessages] = React.useState([]);
      const [input, setInput] = React.useState("");

      const addBot = text =>
        setMessages(prev => [...prev, { role: "bot", text }]);

      return e(
        "div",
        { className: "min-h-screen flex items-center justify-center p-4" },
        e(
          "div",
          { className: "w-full max-w-xl bg-white rounded-3xl shadow-xl h-[90vh] flex flex-col" },

          /* Header */
          e(
            "div",
            { className: "bg-emerald-600 text-white p-4 font-bold text-center" },
            "생명과학 I 성찰 기록장"
          ),

          /* Info Step */
          step === "info" &&
            e(
              "div",
              {
                className:
                  "flex-1 flex flex-col items-center justify-center gap-4 p-6 text-center"
              },
              e("input", {
                className: "border p-3 rounded-xl w-full",
                placeholder: "학번",
                value: studentId,
                onChange: ev => setStudentId(ev.target.value)
              }),
              e("input", {
                className: "border p-3 rounded-xl w-full",
                placeholder: "이름",
                value: name,
                onChange: ev => setName(ev.target.value)
              }),
              e(
                "button",
                {
                  className:
                    "bg-emerald-600 text-white px-6 py-3 rounded-xl",
                  onClick: () => {
                    if (!name || !studentId) {
                      alert("학번과 이름을 입력하세요.");
                      return;
                    }
                    setStep("chat");
                    addBot(
                      `${name} 학생, 생명과학 수업을 돌아보며 성찰을 시작해 볼까요?\n\n수업 중 가장 기억에 남았던 내용은 무엇인가요?`
                    );
                  }
                },
                "성찰 시작하기"
              )
            ),

          /* Chat Step */
          step === "chat" &&
            e(
              React.Fragment,
              null,
              e(
                "div",
                { className: "flex-1 overflow-y-auto p-4 space-y-3" },
                messages.map((m, i) =>
                  e(
                    "div",
                    {
                      key: i,
                      className:
                        m.role === "bot" ? "text-left" : "text-right"
                    },
                    e(
                      "div",
                      {
                        className:
                          m.role === "bot"
                            ? "inline-block bg-slate-100 p-3 rounded-xl"
                            : "inline-block bg-emerald-600 text-white p-3 rounded-xl"
                      },
                      m.text.split("\n").map((line, j) =>
                        e("div", { key: j }, line)
                      )
                    )
                  )
                )
              ),
              e(
                "div",
                { className: "p-3 border-t flex gap-2" },
                e("textarea", {
                  className: "flex-1 border rounded-xl p-2",
                  rows: 2,
                  value: input,
                  onChange: ev => setInput(ev.target.value)
                }),
                e(
                  "button",
                  {
                    className:
                      "bg-emerald-600 text-white px-4 rounded-xl",
                    onClick: () => {
                      if (!input.trim()) return;
                      setMessages(prev => [
                        ...prev,
                        { role: "user", text: input }
                      ]);
                      setInput("");
                      setTimeout(
                        () =>
                          addBot(
                            "성찰 내용이 잘 기록되었습니다. 계속 작성해 보세요 😊"
                          ),
                        400
                      );
                    }
                  },
                  "전송"
                )
              )
            )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      e(App)
    );
  </script>
</body>
</html>
